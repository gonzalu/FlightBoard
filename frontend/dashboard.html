<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlightBoard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header id="hdr">
    <div id="title">FLIGHTBOARD</div>
    <div id="hdrRight">
      <span id="rangeLabel"></span>
      <span id="clock"></span>
    </div>
  </header>
  <main>
    <section id="radarPane">
      <canvas id="radar" width="640" height="640"></canvas>
    </section>
    <section id="listPane">
      <div id="cards"></div>
    </section>
  </main>
  <footer id="ftr">
    <span id="status">connecting&hellip;</span>
    <span id="count"></span>
  </footer>
  <!-- optional: generated by tools/make_logos.py; falls back to a generic icon -->
  <script src="logo-aliases.js"></script>
  <script src="logos.js" onerror="window.LOGOS=undefined"></script>
  <script src="dashboard.js"></script>
</body>
</html>
